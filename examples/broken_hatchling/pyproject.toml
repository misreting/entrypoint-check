[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epkg-broken-hatchling"
version = "0.1.0"
description = "Demo package for entrypoint-check README evidence: a broken console_scripts entry point, built with hatchling."
requires-python = ">=3.11"

[project.scripts]
# Deliberately broken: epkg.cli defines `main`, not `main_typo`.
epkg = "epkg.cli:main_typo"

[tool.hatch.build.targets.wheel]
packages = ["src/epkg"]
